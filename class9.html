<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Battle Arena – Class IX</title>
<link rel="stylesheet" href="portal.css">
<style>
body { font-size: 19px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 14px 16px 36px; }
.top { display: flex; gap: 10px; flex-wrap: wrap; }
.team {
  flex: 1;
  min-width: 190px;
  background: var(--card);
  border: 4px solid var(--line);
  border-radius: 18px;
  padding: 10px 12px;
  text-align: center;
  transition: transform 0.2s, border-color 0.2s;
  box-shadow: var(--shadow);
}
.team.on { transform: scale(1.03); }
.t0.on { border-color: var(--red); }
.t1.on { border-color: var(--blue); }
.team input {
  font: inherit;
  font-weight: 800;
  text-align: center;
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--ink);
}
.t0 input { color: var(--red); }
.t1 input { color: var(--blue); }
.score { font-size: 44px; font-weight: 900; line-height: 1.05; }
.life-row { display: flex; gap: 5px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
.life-tag {
  font-size: 12px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg);
  border: 1px solid var(--line);
}
.life-tag.used { opacity: 0.35; text-decoration: line-through; }

.mid {
  min-width: 160px;
  text-align: center;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 8px 12px;
  box-shadow: var(--shadow);
}
.clock { font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; }

button.abtn {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 12px;
  padding: 12px 20px;
  background: var(--ink);
  color: var(--bg);
  font-weight: 800;
  transition: transform 0.1s;
}
button.abtn:active { transform: scale(0.96); }
button.sm { padding: 6px 12px; font-size: 15px; }
button:disabled { opacity: 0.52; cursor: default; }

.spot-strip {
  margin-top: 10px;
  background: var(--card);
  border: 2px dashed var(--a);
  border-radius: 14px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 16px;
  font-weight: 700;
}

.bar { display: flex; gap: 6px; justify-content: center; margin: 10px 0 0; flex-wrap: wrap; }
.bar button {
  padding: 5px 12px;
  border-radius: 20px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.bar button.cur { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.panel {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 20px;
  margin-top: 12px;
  min-height: 390px;
  box-shadow: var(--shadow);
}
h1, h2 { margin: 0.2em 0; }
.mut { color: var(--mut); }
.c { text-align: center; }
.q { font-size: 27px; font-weight: 800; margin: 12px 0; text-align: center; }
.opts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.opts button {
  flex: 1;
  min-width: 180px;
  font: inherit;
  font-weight: 800;
  font-size: 22px;
  padding: 16px;
  border-radius: 14px;
  background: var(--bg);
  color: var(--ink);
  border: 3px solid var(--line);
  cursor: pointer;
}
.opts button:hover:not(:disabled) { border-color: var(--ink); }
.opts button.good { background: var(--ok); color: #fff; border-color: var(--ok); opacity: 1; }
.opts button.bad { background: #c0392b; color: #fff; border-color: #c0392b; opacity: 1; }
.opts button[data-e]::before { content: attr(data-e) " "; }
.opts.st button { min-width: 90px; font-size: 17px; padding: 8px; }
.opts.st button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.turn { text-align: center; font-weight: 900; font-size: 23px; }
.fb { text-align: center; font-size: 20px; min-height: 54px; margin-top: 10px; font-weight: 700; }
.clue { max-width: 760px; margin: 6px auto; padding: 10px 14px; border-left: 6px solid var(--blue); background: var(--bg); border-radius: 8px; font-size: 20px; }
.case { max-width: 820px; margin: 8px auto; padding: 12px 14px; border: 3px dashed var(--line); border-radius: 14px; font-size: 18px; }
.pts { display: inline-block; background: var(--ok); color: #fff; border-radius: 20px; padding: 2px 14px; font-weight: 800; }
.evt { max-width: 700px; margin: 10px auto; padding: 12px; border-radius: 14px; background: #f4b400; color: #14213d; font-weight: 900; text-align: center; animation: pop 0.5s; }
@keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.sim { display: grid; grid-template-columns: 1fr 1.2fr; gap: 18px; }
@media (max-width: 800px) { .sim { grid-template-columns: 1fr; } }
pre { background: #0b1020; color: #7cfc9a; border-radius: 12px; padding: 10px; font-size: 13px; height: 140px; overflow: auto; margin: 0; white-space: pre-wrap; }
canvas { width: 100%; height: 110px; border: 2px solid var(--line); border-radius: 10px; margin-top: 6px; background: var(--bg); }
canvas#sc { height: auto; width: 260px; max-width: 100%; display: block; margin: auto; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.big { font-size: 58px; text-align: center; }
.mt { border-collapse: collapse; margin: 6px auto; font-size: 15px; }
.mt td { border: 2px solid var(--line); padding: 4px 10px; text-align: center; }
.card {
  display: inline-block;
  margin: 4px;
  padding: 8px 12px;
  font-size: 34px;
  background: var(--bg);
  border: 3px solid var(--line);
  border-radius: 14px;
  cursor: grab;
  user-select: none;
  text-align: center;
}
.card.sel { border-color: var(--blue); transform: scale(1.12); }
.card small { display: block; font-size: 14px; line-height: 1.3; }
.pc { display: inline-block; margin: 3px; font-size: 22px; padding: 2px 6px; background: var(--ok); color: #fff; border-radius: 10px; text-align: center; }
.tray { min-height: 70px; text-align: center; border: 3px dashed var(--line); border-radius: 14px; padding: 6px; margin: 8px 0; }
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.zone { border: 3px solid var(--line); border-radius: 14px; padding: 8px; min-height: 90px; text-align: center; cursor: pointer; background: var(--card); }
.zone:hover { border-color: var(--blue); }
.shake { animation: sh 0.3s; }
@keyframes sh { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.grp { margin: 6px 0; }
.grp > span { font-weight: 700; font-size: 15px; }
.float { display: flex; justify-content: center; gap: 14px; font-size: 38px; margin: 10px; }
.float span { animation: bob 1.6s ease-in-out infinite; }
.float span:nth-child(2n) { animation-delay: 0.4s; }
@keyframes bob { 50% { transform: translateY(-10px); } }
.lifelines-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
</style>
</head>
<body>
<nav id="portal-nav"></nav>

<div class="wrap">
  <div class="top">
    <div class="team t0" id="t0">
      <input id="n0" value="Neural Ninjas" aria-label="Team 1 Name">
      <div class="score" id="s0">0</div>
      <div class="life-row" id="l0"></div>
    </div>
    <div class="mid">
      <div class="clock" id="clk">30:00</div>
      <div class="mut" id="rl" style="font-size:15px">Ready</div>
      <button class="abtn sm" id="pp">Start</button>
    </div>
    <div class="team t1" id="t1">
      <input id="n1" value="Data Dragons" aria-label="Team 2 Name">
      <div class="score" id="s1">0</div>
      <div class="life-row" id="l1"></div>
    </div>
  </div>

  <div class="spot-strip">
    <span id="spot-label">🎤 Challengers at Board: Pick 2 challengers or call any student!</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="p-pill warm" onclick="Portal.openPicker('9', setChallengers)">⚔️ Pick Challengers</button>
      <a class="p-pill primary" href="class9_quest.html">👾 New: Activity 2 (CBSE 10 PYQ Quest) →</a>
    </div>
  </div>

  <div class="bar" id="bar"></div>
  <div class="panel" id="main"></div>
</div>

<script src="portal.js"></script>
<script>
const $ = id => document.getElementById(id);
const sh = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

function setChallengers(txt) {
  $("spot-label").innerHTML = `🎤 At the Board: <b style="color:var(--a)">${txt}</b>`;
}
Portal.mountBar("portal-nav", { active: "9", cls: "9", onPick: setChallengers });

const S = [0, 0], dbl = [1, 1];
const LIFE = [{ poll: true, fifty: true, swap: true }, { poll: true, fifty: true, swap: true }];
let R = -1, left = 1800, run = false, tick = null, Q = {};
const STAGES = ["Problem Scoping", "Data Acquisition", "Data Exploration", "Modelling", "Evaluation"];

/* ---------- Question Banks ---------- */
const R1 = [
  ["Face unlock on a smartphone", "AI", "It learns the pattern of your face.", "📱"],
  ["Calculator adding 2 + 2", "Not AI", "Fixed rules, no learning.", "🧮"],
  ["Smart speaker understanding “play a song”", "AI", "It processes speech and language.", "🔊"],
  ["Traffic light on a fixed 60-second timer", "Not AI", "A timer, not a learner. A camera-based signal that adapts would be AI.", "🚦"],
  ["Chess app that improves by playing millions of games", "AI", "It learns from experience.", "♟️"],
  ["Excel SUM formula", "Not AI", "It follows a fixed rule.", "📊"],
  ["Photo app that groups pictures by person", "AI", "It recognises faces in images.", "🖼️"],
  ["Automatic door that opens on any motion", "Not AI", "One fixed rule: motion → open.", "🚪"],
  ["YouTube autoplay picking your next video", "AI", "It learns from what you watch.", "▶️"],
  ["Thermostat that learns your daily schedule", "AI", "It learns from your behaviour.", "🌡️"],
  ["Thermostat fixed at 24 °C", "Not AI", "No data, no learning.", "🔥"],
  ["Washing machine that weighs clothes and picks water level using a trained model", "AI", "A trained model makes the decision.", "🧺"],
  ["Email spam filter catching new junk mail patterns", "AI", "It learns spam features from millions of examples.", "✉️"],
  ["Digital stopwatch counting seconds", "Not AI", "Purely rule-based counting, zero learning.", "⏱️"],
  ["Delivery drone avoiding trees using live camera vision", "AI", "Real-time object detection uses Computer Vision.", "🚁"]
].map(([q, a, w, e]) => ({ q, o: ["AI", "Not AI"], a, w, e }));

const D3 = ["Data", "Computer Vision", "NLP"];
const R2 = [
  [["It takes an input.", "The input is a photo of a leaf.", "It says whether the plant is diseased."], "Computer Vision", "Images in, so Computer Vision."],
  [["Used by a bank.", "It reads thousands of customer emails.", "It tags each one as complaint or praise."], "NLP", "Reading human language is NLP."],
  [["A farm uses it.", "It looks at rainfall, soil pH and past yields in a sheet.", "It predicts next season’s crop output."], "Data", "Numbers and tables: Data."],
  [["It listens first.", "You say “Hey…” and it answers.", "It turns speech into meaning."], "NLP", "Speech and language: NLP."],
  [["Installed at a railway station.", "Cameras watch the platform.", "It alerts when someone crosses the yellow line."], "Computer Vision", "Video is visual data: CV."],
  [["A cricket board uses it.", "Ten years of scores, pitch types and weather numbers.", "It predicts a team’s score."], "Data", "Statistics in rows: Data."],
  [["Lives on your phone keyboard.", "It suggests your next word.", "It learned from huge amounts of text."], "NLP", "Predicting text: NLP."],
  [["A shop counter.", "A camera looks at fruits on the scale.", "It names the fruit without a barcode."], "Computer Vision", "It must see the fruit: CV."],
  [["A hospital uses it.", "Past patient records of age, BP and sugar in rows.", "It estimates the risk of illness."], "Data", "Tabular records: Data."],
  [["Used in a school library.", "Students scan a book cover with a tablet.", "It identifies the book instantly without reading the barcode."], "Computer Vision", "Recognising a cover image is Computer Vision."],
  [["A travel app feature.", "You type a sentence in Hindi.", "It outputs natural Tamil sentences."], "NLP", "Machine translation of language is NLP."]
].map(([c, a, w]) => ({ q: "Which AI domain is this?", c, o: D3, a, w, e: "🕵️" }));

const O4 = ["Bias", "Privacy", "Transparency", "Misinformation"];
const R5 = [
  ["A hiring AI rejects most women because it learnt from old, male-heavy data", "Bias", "Unfair data gives unfair results.", ["Retrain on balanced, diverse data and audit the results", "Hide the AI’s decisions", "Add even more of the same old data"], "👩‍💼"],
  ["An app records your voice all day without telling you", "Privacy", "Data was collected without consent.", ["Ask clear consent and collect only what is needed", "Bury it in the terms and conditions", "Sell the recordings"], "🎙️"],
  ["A loan AI rejects you and nobody can explain why", "Transparency", "AI decisions must be explainable.", ["Use an explainable model and give reasons", "Tell customers it is a secret", "Make the AI bigger"], "🏦"],
  ["A deepfake video shows a teacher saying false things", "Misinformation", "AI-made fake content spreads wrong information.", ["Check the source, report it and label AI content", "Forward it to all friends", "Ignore everything online"], "🎭"],
  ["A face-unlock fails often for darker skin tones", "Bias", "The training data did not include everyone.", ["Test on all skin tones and add diverse images", "Use it only in bright light", "Ignore the complaints"], "🔓"],
  ["A school app shares students’ photos and marks with advertisers", "Privacy", "Personal data must not be shared without permission.", ["Share nothing without parental consent and delete extra data", "Share only marks, not photos", "Let advertisers decide"], "🏫"],
  ["A chatbot confidently gives a wrong medicine dose", "Misinformation", "Confident but false answers mislead people.", ["Add expert review and show sources", "Make its tone more confident", "Remove the disclaimer"], "💊"],
  ["A student grading AI gives zero marks but teachers aren't allowed to see its scoring rules", "Transparency", "High-stakes AI must show how it reaches decisions.", ["Publish clear scoring criteria and allow human review", "Keep the algorithm hidden to avoid questions", "Grade even faster"], "📝"]
].map(([q, a, w, f, e]) => ({ q, o: O4, a, w, f, fa: f[0], e }));

const CASES = [
  {
    t: "Smart Dustbin, KV Tenali", e: "🗑️", story: "Students want a dustbin that sorts waste on its own.", s: [
      ["The team writes: “Can AI tell plastic from paper?” after the principal complains about litter.", 0],
      ["Students click 400 photos of waste items using phones.", 1],
      ["A chart shows only 20 of the 400 photos are metal.", 2],
      ["An image classifier is trained to sort waste.", 3],
      ["On 50 unseen photos it is right 41 times.", 4]
    ]
  },
  {
    t: "Crop Doctor App", e: "🌱", story: "Farmers in Guntur lose crops to leaf diseases.", s: [
      ["The team decides to detect disease from leaf photos, not soil tests.", 0],
      ["Volunteers collect 1,000 leaf photos from different farms and seasons.", 1],
      ["Blurry photos are removed and each disease is checked for enough samples.", 2],
      ["A neural network learns patterns of spots and colour.", 3],
      ["Accuracy on fresh farm photos is 78%, so they plan to add more data.", 4]
    ]
  },
  {
    t: "Bus Rush Predictor", e: "🚌", story: "Students arrive late because of crowded buses.", s: [
      ["The goal is set: predict which hour the bus will be most crowded.", 0],
      ["The depot shares daily passenger counts for six months.", 1],
      ["A graph reveals Monday mornings are busiest.", 2],
      ["A model is trained on counts, time of day and weather.", 3],
      ["Predictions are compared with the real counts of the next week.", 4]
    ]
  },
  {
    t: "School Library Book Finder", e: "📚", story: "Students struggle to pick books they will enjoy.", s: [
      ["Students interview librarians to define the goal: recommend 3 books per reader.", 0],
      ["Borrowing logs from the past 2 years are gathered safely without student names.", 1],
      ["Bar charts show sci-fi and mystery peak before holidays.", 2],
      ["A recommendation model groups readers with similar interests.", 3],
      ["Students rate the suggestions and the model scores 84% satisfaction.", 4]
    ]
  }
];

const ROUNDS = [
  { t: "Round 1 · Spot the Trick", m: 5, k: "wager", n: 6, pool: R1 },
  { t: "Round 2 · Domain Detective", m: 6, k: "clue", n: 6, pool: R2 },
  { t: "Round 3 · Case File", m: 5, k: "case" },
  { t: "Round 4 · Train the Machine", m: 8, k: "sim" },
  { t: "Round 5 · Ethics Roulette", m: 6, k: "eth", n: 5, pool: R5 }
];

const EM = {
  "AI": "🤖", "Not AI": "🧱", "Data": "📊", "Computer Vision": "👁️", "NLP": "💬",
  "Bias": "⚖️", "Privacy": "🔒", "Transparency": "🔍", "Misinformation": "📰",
  "Problem Scoping": "🎯", "Data Acquisition": "📥", "Data Exploration": "🔎",
  "Modelling": "⚙️", "Evaluation": "✅"
};

/* ---------- Helpers ---------- */
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
const nm = i => $("n" + i).value || "Team " + (i + 1);
const col = i => i ? "var(--blue)" : "var(--red)";

function renderLifelines(i) {
  const L = LIFE[i];
  $("l" + i).innerHTML = `
    <span class="life-tag ${L.poll ? "" : "used"}">🙋 Poll</span>
    <span class="life-tag ${L.fifty ? "" : "used"}">⚡ 50/50</span>
    <span class="life-tag ${L.swap ? "" : "used"}">🔄 Swap</span>
  `;
}

function head(t) {
  $("s0").textContent = S[0]; $("s1").textContent = S[1]; $("clk").textContent = fmt(left);
  $("t0").classList.toggle("on", t === 0); $("t1").classList.toggle("on", t === 1);
  renderLifelines(0); renderLifelines(1);
  $("bar").innerHTML = ROUNDS.map((r, i) => `<button class="${i == R ? "cur" : ""}" onclick="go(${i})">R${i + 1} · ${r.m}m</button>`).join("");
}

function award(t, p) { if (p > 0 && dbl[t] > 1) { p *= dbl[t]; dbl[t] = 1; } S[t] += p; }
function evt(t) {
  Portal.SFX.box();
  const e = Math.random() * 3 | 0;
  if (e == 0) { S[t] += 5; return `🎁 Mystery Box! ${nm(t)} wins a +5 bonus!`; }
  if (e == 1) { dbl[t] = 2; return `⚡ Mystery Box! ${nm(t)}’s next points are DOUBLED!`; }
  const x = Math.min(5, Math.max(0, S[1 - t])); S[1 - t] -= x; S[t] += x;
  return `🦹 Mystery Box! ${nm(t)} steals ${x} points from ${nm(1 - t)}!`;
}

$("pp").onclick = () => {
  run = !run; $("pp").textContent = run ? "Pause" : "Resume";
  if (run && !tick) tick = setInterval(() => { if (run && left > 0) { left--; $("clk").textContent = fmt(left); } }, 1000);
};

function setPreset(a, b) { $("n0").value = a; $("n1").value = b; Portal.SFX.pop(); }

function intro() {
  R = -1; $("rl").textContent = "Ready"; head();
  $("main").innerHTML = `
    <div class="big">🤖⚔️🤖</div>
    <h1 class="c">AI Battle Arena · Class IX</h1>
    <p class="mut c">CBSE AI (417): AI basics · Domains · Project Cycle · Hands-On ML Lab · Ethics</p>
    <div class="row" style="margin:8px 0">
      <button class="p-pill" onclick="setPreset('Neural Ninjas','Data Dragons')">🥷 Neural Ninjas vs 🐉 Data Dragons</button>
      <button class="p-pill" onclick="setPreset('Vision Vipers','NLP Knights')">👁️ Vision Vipers vs 💬 NLP Knights</button>
      <button class="p-pill" onclick="setPreset('Team Alpha','Team Beta')">🅰️ Alpha vs 🅱️ Beta</button>
    </div>
    <ol style="max-width:780px;margin:10px auto">
      <li>Pick team names &amp; click <b>⚔️ Pick Challengers</b> so new students battle at the board each round!</li>
      <li><b>Round 1:</b> Bet <b>10 / 20 / 30</b> before answering. Wrong = lose half your bet.</li>
      <li><b>Round 2:</b> Clues appear one by one. <b>Fewer clues = more points</b> (15 / 10 / 5).</li>
      <li><b>Round 3:</b> Crack a random <b>Case File</b>. <b>Round 4:</b> 4-step <b>Hands-On ML Lab</b> + Confusion Matrix!</li>
      <li><b>Round 5:</b> Spot the Ethics issue, then pick the best fix. Use your 3 lifelines (<b>🙋 Class Poll</b>, <b>⚡ 50/50</b>, <b>🔄 Swap</b>) wisely!</li>
    </ol>
    <div class="float"><span>🤖</span><span>📷</span><span>🗣️</span><span>🧠</span><span>🍎</span><span>🍊</span><span>⚖️</span></div>
    <div class="row"><button class="abtn" onclick="go(0)">Begin Round 1 ▶</button></div>
  `;
}
function nextBtn() { return `<div class="row"><button class="abtn" onclick="go(${R + 1})">${R == 4 ? "Final Result 🏆" : "Next Round ▶"}</button></div>`; }

/* ---------- Question Engine (Rounds 1, 2, 3, 5) ---------- */
function go(r) {
  R = r; if (r >= 5) return end();
  const o = ROUNDS[r]; $("rl").textContent = o.t.split(" · ")[0];
  if (!run) $("pp").click();
  Portal.SFX.pop();
  if (o.k == "sim") { head(); return sim(); }
  let items, cs, reserve = [];
  if (o.k == "case") {
    cs = CASES[Math.random() * CASES.length | 0];
    items = sh(cs.s).map(([q, s]) => ({ q, o: STAGES, a: STAGES[s], w: "This is the " + STAGES[s] + " stage." }));
  } else {
    const shuffled = sh(o.pool);
    items = shuffled.slice(0, o.n);
    reserve = shuffled.slice(o.n);
  }
  Q = { o, items, reserve, cs, i: 0, base: Math.random() * 2 | 0, steal: false, clue: 0, stake: 10, stage: 0 };
  setQ();
}
function setQ() {
  const it = Q.items[Q.i];
  if (it) { it.ord = sh(it.o); if (it.f) Q.ford = sh(it.f); }
  ask();
}
const owner = () => (Q.base + Q.i) % 2;
const base = () => Q.stage ? 10 : Q.o.k == "clue" ? [15, 10, 5][Q.clue] : Q.o.k == "wager" ? Q.stake : 10;
const pts = () => Q.steal ? Math.ceil(base() / 2) : base();

function ask() {
  const o = Q.o, it = Q.items[Q.i];
  if (!it) {
    head();
    Portal.SFX.win();
    $("main").innerHTML = `<h2>${o.t} complete</h2><p class="q">${nm(0)} ${S[0]} – ${S[1]} ${nm(1)}</p>` + nextBtn();
    return;
  }

const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
const sg = z => 1 / (1 + Math.exp(-z));
function gen(n, pOr, sd, off, flip) {
  const D = [];
  for (let i = 0; i < n; i++) {
    const t = Math.random() < pOr ? 1 : 0;
    D.push({ x: [(t ? 0.65 : 0.35) + off + gauss() * sd, (t ? 0.6 : 0.4) - off + gauss() * sd], t, y: Math.random() < flip ? 1 - t : t });
  }
  return D;
}
function feat(p, d) {
  const a = (p[0] - 0.5) * 2.4, b = (p[1] - 0.5) * 2.4, f = [];
  for (let i = 0; i <= d; i++) for (let j = 0; i + j <= d; j++) if (i + j) f.push(a ** i * b ** j);
  return f;
}
function fit(D, T, d, E) {
  const F = D.map(r => feat(r.x, d)), FT = T.map(r => feat(r.x, d));
  let w = Array(F[0].length).fill(0), b = 0;
  const L = [], LT = [], LR = 0.3;
  const z = f => f.reduce((a, v, j) => a + v * w[j], b);
  const loss = (F, D, key) => {
    let s = 0;
    F.forEach((f, i) => {
      const p = Math.min(0.999, Math.max(0.001, sg(z(f))));
      s -= D[i][key] ? Math.log(p) : Math.log(1 - p);
    });
    return Math.min(3, s / F.length);
  };
  for (let e = 0; e < E; e++) {
    const g = w.map(() => 0); let gb = 0;
    F.forEach((f, i) => {
      const er = sg(z(f)) - D[i].y; gb += er;
      f.forEach((v, j) => g[j] += er * v);
    });
    w = w.map((v, j) => v - LR * g[j] / F.length);
    b -= LR * gb / F.length;
    L.push(loss(F, D, "y"));
    LT.push(loss(FT, T, "t"));
  }
  return { L, LT, F, FT, pred: f => sg(z(f)) > 0.5 ? 1 : 0, nw: w.length + 1 };
}

function trainL() {

    else { b.classList.add("bad", "shake"); Portal.SFX.bad(); $("fb").innerHTML = `❌ ${a} = ${v}%`; }
    setTimeout(() => { LB.mi++; drawQ(); }, 1800);
  });
}

function end() {
  head(); $("rl").textContent = "Finished";
  const w = S[0] == S[1] ? -1 : S[0] > S[1] ? 0 : 1;
  Portal.SFX.win();
  Portal.confetti(55, ["🏆", "🎉", "⭐", "🎈", "✨"]);
  Portal.unlockBadge("c9_strategist");
  Portal.recordC9Match(nm(0), S[0], nm(1), S[1]);
  $("main").innerHTML = `
    <div class="big">🏆</div>
    <h1 class="c" style="color:${w < 0 ? "inherit" : col(w)}">${w < 0 ? "It is a tie!" : nm(w) + " wins!"}</h1>
    <p class="q">${nm(0)} ${S[0]} – ${S[1]} ${nm(1)}</p>
    <p class="mut c">Time left: ${fmt(left)}. Revise: AI vs not AI · domains · project cycle · training data &amp; overfitting · confusion matrix · ethics.</p>
    <div class="row">
      <button class="abtn" onclick="location.reload()">Play again (new random questions)</button>
      <a class="p-pill" href="index.html">🏫 Back to Portal Hub</a>
    </div>
  `;
}

// Support direct hash navigation (#r0 .. #r4)
const h = location.hash.match(/^#r([0-4])$/);
if (h) go(Number(h[1]));
else intro();
</script>
</body>
</html>

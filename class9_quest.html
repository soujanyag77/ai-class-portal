<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class 9 · AI Concept Quest (SDGs · Data · Math · Cycle · GenAI)</title>
<link rel="stylesheet" href="portal.css">
<style>
body { font-size: 18px; }
.q-wrap { max-width: 1120px; margin: 0 auto; padding: 14px 16px 42px; }

/* Squad Scoreboard */
.squads-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px;
}
.sq-card {
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 18px;
  padding: 10px 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.16s, border-color 0.16s, box-shadow 0.16s;
}
.sq-card.on {
  transform: translateY(-2px) scale(1.02);
  border-color: var(--sq-col, var(--a));
  box-shadow: 0 0 0 3px rgba(108, 76, 241, 0.18), var(--shadow);
}
.sq-top { display: flex; align-items: center; gap: 6px; }
.sq-ico { font-size: 1.45rem; }
.sq-name {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-weight: 800;
  font-size: 1rem;
  border: 0;
  background: transparent;
  color: var(--ink);
}
.sq-meta { display: flex; align-items: center; justify-content: space-between; font-weight: 800; margin-top: 3px; }
.sq-xp { font-size: 1.75rem; font-weight: 900; line-height: 1.1; color: var(--sq-col, var(--a)); }
.streak-pill {
  background: linear-gradient(135deg, #ff7a59, #f4b400);
  color: #14213d;
  padding: 2px 9px;
  border-radius: 999px;
  font-weight: 900;
  font-size: 0.78rem;
}

/* Spotlight & Zone Bar */
.spot-strip {
  margin-top: 10px;
  background: var(--card);
  border: 2px dashed var(--a);
  border-radius: 14px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 0.95rem;
  font-weight: 700;
}
.zone-bar {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 12px 0 0;
}
.zone-btn {
  padding: 7px 14px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.12s, border-color 0.15s;
}
.zone-btn:hover { transform: translateY(-1px); border-color: var(--a); }
.zone-btn.cur { background: var(--a); color: #fff; border-color: var(--a); }
.zone-btn.done { border-color: var(--ok); }

/* Stage Panel */
.stage {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 22px;
  padding: 22px 20px;
  margin-top: 12px;
  min-height: 430px;
  box-shadow: var(--shadow);
}
.c { text-align: center; }
.mut { color: var(--mut); }
.topic-tag {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: rgba(108, 76, 241, 0.14);
  color: var(--a);
  border: 1px solid rgba(108, 76, 241, 0.35);
  font-size: 0.82rem;
  font-weight: 800;
}
.xp-pill {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--ok);
  color: #fff;
  font-size: 0.84rem;
  font-weight: 900;
}
.q-title {
  font-size: 1.32rem;
  font-weight: 800;
  line-height: 1.35;
  margin: 10px auto;
  max-width: 840px;
  text-align: center;
}

/* Shared Drag & Drop + Tap Cards */
.dd-tray {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  justify-content: center;
  min-height: 68px;
  padding: 12px;
  background: var(--bg);
  border: 3px dashed var(--line);
  border-radius: 16px;
  margin: 12px 0;
}
.dd-card {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: 13px;
  background: var(--card);
  color: var(--ink);
  border: 3px solid var(--line);
  font-weight: 800;
  font-size: 0.96rem;
  cursor: grab;
  user-select: none;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
  transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s;
}
.dd-card:hover { border-color: var(--a); transform: translateY(-2px); }
.dd-card.sel { border-color: var(--b); box-shadow: 0 0 0 3px rgba(255, 122, 89, 0.25); transform: scale(1.04); }
.dd-card.locked { border-color: var(--ok); background: rgba(27, 158, 90, 0.14); cursor: default; }

.dd-zones {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 10px;
}
.dd-zone {
  background: var(--bg);
  border: 3px dashed var(--line);
  border-radius: 16px;
  padding: 12px;
  min-height: 108px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.12s;
}
.dd-zone.over { border-color: var(--a); background: rgba(108, 76, 241, 0.1); transform: scale(1.02); }
.dd-zone.ok { border-style: solid; border-color: var(--ok); background: rgba(27, 158, 90, 0.08); }
.dd-zone-hd { font-weight: 900; font-size: 1rem; }
.dd-zone-sub { font-size: 0.82rem; color: var(--mut); font-weight: 700; }

/* DIKW Pyramid Tiers */
.pyramid {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin: 12px auto;
}
.pyr-tier {
  width: 100%;
  min-height: 70px;
  padding: 10px 14px;
  border-radius: 14px;
  border: 3px dashed var(--line);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.pyr-tier.over { border-color: var(--a); background: rgba(108, 76, 241, 0.1); }
.pyr-tier.ok { border-style: solid; border-color: var(--ok); background: rgba(27, 158, 90, 0.1); }

/* Clickable Option Grids */
.opts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 11px;
  max-width: 860px;
  margin: 12px auto;
}
.opt-btn {
  font: inherit;
  font-weight: 700;
  font-size: 1rem;
  text-align: left;
  padding: 13px 15px;
  border-radius: 15px;
  background: var(--bg);
  color: var(--ink);
  border: 3px solid var(--line);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.1s, border-color 0.15s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--a); transform: translateY(-1px); }
.opt-btn.good { background: var(--ok); color: #fff; border-color: var(--ok); }
.opt-btn.bad { background: var(--no); color: #fff; border-color: var(--no); }
.opt-btn.picked { border-color: var(--a); background: rgba(108, 76, 241, 0.14); }
.opt-btn:disabled { cursor: default; }

/* Math Live Bar Chart */
.math-bars {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 14px;
  height: 190px;
  padding: 12px;
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 16px;
  max-width: 640px;
  margin: 10px auto;
}
.m-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  width: 72px;
}
.m-bar {
  width: 44px;
  background: linear-gradient(180deg, var(--a), var(--blue));
  border-radius: 10px 10px 4px 4px;
  transition: height 0.2s;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  color: #fff;
  font-weight: 900;
  font-size: 0.85rem;
  padding-top: 4px;
}
.m-ctrl { display: flex; gap: 4px; }
.m-ctrl button {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font-weight: 900;
  cursor: pointer;
}
.stat-strip {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 10px 0;
}
.stat-pill {
  padding: 8px 16px;
  border-radius: 14px;
  background: var(--bg);
  border: 2px solid var(--line);
  font-weight: 800;
}

/* Probability Line */
.prob-scale {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

/* Prompt Studio */
.prompt-box {
  max-width: 820px;
  margin: 10px auto;
  padding: 14px 16px;
  border-radius: 16px;
  background: #0f172a;
  color: #e2e8f0;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 0.96rem;
  line-height: 1.5;
  border: 2px solid var(--line);
}
.meter-wrap {
  max-width: 460px;
  margin: 8px auto;
  height: 14px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.meter-fill { height: 100%; transition: width 0.3s; background: linear-gradient(90deg, var(--b), var(--ok)); }
.blk-chip {
  padding: 9px 14px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-weight: 800;
  cursor: pointer;
}
.blk-chip.on { background: var(--a); color: #fff; border-color: var(--a); }

/* Buttons & Feedback */
button.qbtn {
  font: inherit;
  font-weight: 800;
  border: 0;
  border-radius: 13px;
  padding: 11px 20px;
  background: var(--a);
  color: #fff;
  cursor: pointer;
  transition: transform 0.1s;
}
button.qbtn.warm { background: var(--b); }
button.qbtn.ok { background: var(--ok); }
button.qbtn:active { transform: scale(0.96); }
button.qbtn:disabled { opacity: 0.48; cursor: default; }

.fb-box {
  max-width: 840px;
  margin: 12px auto 0;
  padding: 12px 16px;
  border-radius: 14px;
  background: var(--bg);
  border: 2px solid var(--line);
  text-align: center;
  font-weight: 700;
  min-height: 46px;
}
.fb-box.ok { border-color: var(--ok); background: rgba(27, 158, 90, 0.12); }
.fb-box.bad { border-color: var(--no); background: rgba(214, 48, 49, 0.1); }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.shake { animation: sh 0.32s; }
@keyframes sh { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

.lobby-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin: 14px 0;
}
.lobby-tile {
  background: var(--bg);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.14s, border-color 0.14s;
}
.lobby-tile:hover { transform: translateY(-2px); border-color: var(--a); }
.lobby-tile b { display: block; font-size: 2.1rem; margin-bottom: 4px; }
</style>
</head>
<body>
<nav id="portal-nav"></nav>

<div class="q-wrap">
  <div class="squads-grid" id="squads-grid"></div>

  <div class="spot-strip">
    <span id="spot-label">🎤 Active Student: Spin Spotlight or tap a Squad to take the board!</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="p-pill warm" onclick="Portal.openPicker('9', setSpotStudent)">🎲 Spotlight Student</button>
      <button class="p-pill" onclick="classVoteCurrent()">🙋 Whole-Class Poll</button>
    </div>
  </div>

  <div class="zone-bar" id="zone-bar"></div>
  <main class="stage" id="stage"></main>
</div>

<script src="portal.js"></script>
<script>
const $ = id => document.getElementById(id);
const sh = arr => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function setSpotStudent(txt) {
  $("spot-label").innerHTML = `🎤 At the Board: <b style="color:var(--a)">${esc(txt)}</b>`;
}
Portal.mountBar("portal-nav", { active: "9q", cls: "9", onPick: setSpotStudent });

/* ---------- Squads & XP Engine ---------- */
const SQUAD_PRESETS = [
  { name: "SDG Sparks", ico: "🌍", col: "#1b9e5a" },
  { name: "Data Ninjas", ico: "📊", col: "#1d70d6" },
  { name: "Math Wizards", ico: "🔢", col: "#9b5de5" },
  { name: "GenAI Creators", ico: "✨", col: "#e63946" }
];

let squadCount = 3;
let squads = [];
let activeSq = 0;
let curZone = -1;
let curPollPrompt = { q: "Which option does the class choose?", opts: ["Option A", "Option B", "Option C"] };
const zonesDone = [false, false, false, false, false];

function initSquads(n) {
  squadCount = n;
  squads = SQUAD_PRESETS.slice(0, n).map(p => ({ ...p, xp: 0, streak: 0 }));
  activeSq = 0;
  renderSquads();
}

const multOf = s => s >= 3 ? 2 : s === 2 ? 1.5 : s === 1 ? 1.25 : 1;

function awardXP(sqIdx, base) {
  const sq = squads[sqIdx];
  const gained = Math.round(base * multOf(sq.streak));
  sq.xp += gained;
  sq.streak++;
  renderSquads();
  return gained;
}

function missTurn(sqIdx) {
  squads[sqIdx].streak = 0;
  renderSquads();
}

function renderSquads() {
  $("squads-grid").innerHTML = squads.map((s, i) => `
    <div class="sq-card ${i === activeSq ? "on" : ""}" style="--sq-col:${s.col}" onclick="selectSquad(${i})" title="Tap to switch active squad">
      <div class="sq-top">
        <span class="sq-ico">${s.ico}</span>
        <input class="sq-name" value="${esc(s.name)}" aria-label="Squad ${i + 1}" onclick="event.stopPropagation()" oninput="squads[${i}].name=this.value||'Squad ${i + 1}'">
      </div>
      <div class="sq-meta">
        <span class="sq-xp">${s.xp} XP</span>
        <span class="streak-pill">🔥 ${s.streak} (${multOf(s.streak)}×)</span>
      </div>
    </div>
  `).join("");
}

function selectSquad(i) { activeSq = i; Portal.SFX.pop(); renderSquads(); }
function nextSquad() { activeSq = (activeSq + 1) % squadCount; renderSquads(); }

function classVoteCurrent() {
  Portal.openPoll(curPollPrompt.q, curPollPrompt.opts, (top, _c, total) => {
    Portal.toast(`🙋 Class voted (${total}): ${top}`);
  });
}

/* ---------- Shared Drag & Drop + Tap Helper ---------- */
let DD_SEL = null;
function bindDragDrop(onDropFn) {
  DD_SEL = null;
  document.querySelectorAll("[data-dd-card]").forEach(el => {
    el.draggable = true;
    el.ondragstart = e => {
      DD_SEL = el.dataset.ddCard;
      e.dataTransfer.setData("text/plain", DD_SEL);
    };
    el.onclick = e => {
      e.stopPropagation();
      const id = el.dataset.ddCard;
      DD_SEL = (DD_SEL === id) ? null : id;
      document.querySelectorAll("[data-dd-card]").forEach(x => x.classList.toggle("sel", x.dataset.ddCard === DD_SEL));
      Portal.SFX.pop();
    };
  });
  document.querySelectorAll("[data-dd-zone]").forEach(zn => {
    zn.ondragover = e => { e.preventDefault(); zn.classList.add("over"); };
    zn.ondragleave = () => zn.classList.remove("over");
    zn.ondrop = e => {
      e.preventDefault();
      zn.classList.remove("over");
      const cid = e.dataTransfer.getData("text/plain") || DD_SEL;
      if (cid) onDropFn(cid, zn.dataset.ddZone, zn);
    };
    zn.onclick = () => {
      if (DD_SEL) onDropFn(DD_SEL, zn.dataset.ddZone, zn);
    };
  });
}

/* ---------- Zones Navigation ---------- */
const ZONES = [
  { id: 0, ico: "🌍", t: "Z1 · SDGs", sub: "Drag-Drop AI Solutions to UN SDGs" },
  { id: 1, ico: "📊", t: "Z2 · Data Literacy", sub: "DIKW Pyramid, Data Types & Privacy" },
  { id: 2, ico: "🔢", t: "Z3 · Math for AI", sub: "Patterns, Live Mean/Median & Probability" },
  { id: 3, ico: "🔄", t: "Z4 · AI Project Cycle", sub: "Stage Order, 4Ws Canvas & Modelling" },
  { id: 4, ico: "✨", t: "Z5 · Generative AI", sub: "Gen vs Discriminative, Prompts & Ethics" }
];

function renderZoneBar() {
  $("zone-bar").innerHTML =
    `<button class="zone-btn ${curZone === -1 ? "cur" : ""}" onclick="showLobby()">🏠 Lobby</button>` +
    ZONES.map((z, i) => `<button class="zone-btn ${curZone === i ? "cur" : ""} ${zonesDone[i] ? "done" : ""}" onclick="enterZone(${i})">${z.ico} ${z.t.split(" · ")[1]}${zonesDone[i] ? " ✓" : ""}</button>`).join("");
}

function showLobby() {
  curZone = -1;
  curPollPrompt = { q: "Which Class 9 AI topic are you most excited to play first?", opts: ZONES.map(z => z.t) };
  renderZoneBar();
  renderSquads();
  $("stage").innerHTML = `
    <div class="c">
      <div style="font-size:3rem">🌍📊🔢🔄✨</div>
      <h1 style="margin:4px 0">Class 9 · AI Concept Quest</h1>
      <p class="mut" style="max-width:740px;margin:0 auto 12px">
        Drag, drop, click &amp; build across all 5 Class 9 AI topics: <b>SDGs · Data Literacy · Math for AI · AI Project Cycle · Generative AI</b>!
      </p>
      <div class="row" style="margin-bottom:14px">
        <span style="font-weight:800">Squads:</span>
        ${[2, 3, 4].map(n => `<button class="p-pill ${squadCount === n ? "primary" : ""}" onclick="initSquads(${n});showLobby();Portal.SFX.pop()">${n} Squads</button>`).join("")}
        <button class="p-pill warm" onclick="Portal.openPicker('9', setSpotStudent)">🎲 Spin Student Spotlight</button>
      </div>
    </div>
    <div class="lobby-cards">
      ${ZONES.map((z, i) => `
        <div class="lobby-tile" onclick="enterZone(${i})">
          <b>${z.ico}</b>
          <div style="font-weight:900;font-size:1.05rem">${z.t}</div>
          <small class="mut">${z.sub}</small>
        </div>
      `).join("")}
    </div>
    <div class="row">
      <button class="qbtn" onclick="enterZone(0)">🚀 Start Quest at Zone 1: SDGs ▶</button>
    </div>
  `;
}

function enterZone(z) {
  curZone = z;
  renderZoneBar();
  Portal.SFX.pop();
  if (z === 0) startZ1();
  else if (z === 1) startZ2();
  else if (z === 2) startZ3();
  else if (z === 3) startZ4();
  else if (z === 4) startZ5();
}

/* ==========================================================================
   ZONE 1: SDGs (Drag-and-Drop Matchmaker + SDG Concept Clicks)
   ========================================================================== */
const Z1_PAIRS = [
  { id: "sdg2", txt: "🌾 Drone scans leaves to save wheat crops", goal: "SDG 2 · Zero Hunger", ico: "🍽️" },
  { id: "sdg4", txt: "📚 AI tutor teaches in local languages", goal: "SDG 4 · Quality Education", ico: "🎓" },
  { id: "sdg6", txt: "💧 Smart sensors stop city pipe leaks", goal: "SDG 6 · Clean Water", ico: "🚰" },
  { id: "sdg7", txt: "☀️ AI balances solar & wind power grids", goal: "SDG 7 · Clean Energy", ico: "⚡" },
  { id: "sdg14", txt: "🛰️ Satellite AI spots illegal ocean fishing", goal: "SDG 14 · Life Below Water", ico: "🐠" },
  { id: "sdg15", txt: "🌳 Acoustic AI detects illegal forest logging", goal: "SDG 15 · Life on Land", ico: "🦁" }
];
const Z1_CONCEPTS = [
  {
    q: "How many Sustainable Development Goals (SDGs) were adopted by the United Nations to achieve by 2030?",
    opts: ["17 SDGs", "10 SDGs", "25 SDGs", "8 SDGs"],
    a: 0,
    tip: "The UN adopted 17 interconnected SDGs in 2015 as a global blueprint for 2030."
  },
  {
    q: "An AI medical app only works on expensive phones in English. Which SDG principle is violated?",
    opts: ["Inclusion & Equal Access (Reduced Inequalities)", "Zero Energy Consumption", "Automated Speed", "Cloud Storage"],
    a: 0,
    tip: "AI for SDGs must reduce inequalities (SDG 10) and include everyone, not leave communities behind."
  }
];

let Z1 = {};
function startZ1() {
  Z1 = { step: 0, cards: sh(Z1_PAIRS), goals: sh(Z1_PAIRS), matched: {}, qIdx: 0 };
  renderZ1();
}
function renderZ1() {
  const sq = squads[activeSq];
  if (Z1.step === 0) {
    curPollPrompt = { q: "Which SDG should each AI tool match?", opts: Z1_PAIRS.map(p => p.goal) };
    const rem = Z1.cards.filter(c => !Z1.matched[c.id]);
    $("stage").innerHTML = `
      <div class="c">
        <span class="topic-tag">Topic 1 · Sustainable Development Goals (SDGs)</span>
        <span class="xp-pill">+15 XP per match</span>
        <div style="margin-top:6px;font-weight:900;color:${sq.col}">${sq.ico} ${esc(sq.name)}'s Turn</div>
        <h2 style="margin:6px 0">🌍 Drag &amp; Drop AI Solutions to the Right SDG!</h2>
        <p class="mut" style="margin:0">Drag a card (or tap a card, then tap its matching SDG card below).</p>
      </div>
      <div class="dd-tray">

function calcStats(arr) {
  const mean = +(arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);
  const sorted = [...arr].sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  const median = sorted.length % 2 ? sorted[mid] : +((sorted[mid - 1] + sorted[mid]) / 2).toFixed(1);
  const freq = {};
  arr.forEach(v => freq[v] = (freq[v] || 0) + 1);
  const maxF = Math.max(...Object.values(freq));
  const modes = Object.keys(freq).filter(k => freq[k] === maxF);
  const mode = maxF === 1 ? "None" : modes.join(", ");
  return { mean, median, mode };
}

function adjBar(i, delta) {
  Z3.bars[i] = Math.max(2, Math.min(40, Z3.bars[i] + delta));
  Portal.SFX.tick();
  renderZ3();
}

function checkMathLab() {
  const st = calcStats(Z3.bars);
  const fb = $("z3-fb");
  if (Z3.mathGoal === 0) {
    if (st.mean === 16) {
      const xp = awardXP(activeSq, 25);
      Z3.mathGoal = 1;
      Portal.SFX.good(); Portal.confetti(16);

      $("z3-fb").className = "fb-box ok";
      $("z3-fb").innerHTML = `✅ Mean = 16 achieved! (+${xp} XP) Now try pushing the last bar to 30+ to see the Outlier effect!`;

      fb.innerHTML = `❌ Mean is currently <b>${st.mean}</b>. Adjust the bars so total = 80 (Mean = 16)!`;

      setTimeout(() => { Z3.step = 2; nextSquad(); renderZ3(); }, 1500);
    } else {
      Portal.SFX.bad();
      fb.className = "fb-box bad";
      fb.innerHTML = "❌ Push at least one bar up to 30+ using + to create an outlier!";

}
